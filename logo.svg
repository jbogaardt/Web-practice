<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wasatch Faux Rock logo">
  <defs>
    <!-- The left half of the W is cut out of the stone like an open crack -->
    <mask id="crack" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M15 25 L24 45 L32 29" fill="none" stroke="#000" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#crack)">
    <path fill="#8b7e6f" d="M6 38 L12 18 L27 6 L46 8 L58 24 L57 47 L41 59 L20 57 Z"/>
    <path fill="#aa9c89" d="M12 18 L27 6 L46 8 L33 24 Z"/>
    <path fill="#6c6155" d="M46 8 L58 24 L57 47 L44 36 Z"/>
    <path fill="#756a5d" d="M6 38 L20 57 L41 59 L30 44 Z"/>
  </g>
  <!-- The right half of the W is the repair: the same crack, filled in -->
