<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 6 64 49" role="img" aria-label="Wasatch Faux Rock logo">
  <defs>
    <linearGradient id="granite" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f1e7d4"/>
      <stop offset="0.5" stop-color="#b39b78"/>
      <stop offset="1" stop-color="#62513c"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bba98c"/>
      <stop offset="1" stop-color="#7a6a54"/>
    </linearGradient>
    <clipPath id="body">
      <path d="M5 46 C5 44 6 43 7 41 L17 24 L24 34 L31 9 L39 33 L46 22 L52 33 L52 53 L9 53 C6.5 53 5 51.5 5 49 Z"/>
    </clipPath>
    <mask id="strokeGaps" maskUnits="userSpaceOnUse" x="0" y="0" width="70" height="64">
      <rect width="70" height="64" fill="#fff"/>
      <g stroke="#000" stroke-width="1.3" stroke-linecap="round">
        <path d="M20 43.5 H47"/><path d="M14 48 H40"/>
      </g>
    </mask>
  </defs>
  <!-- One loaded paint stroke. Its top edge is the Wasatch ridgeline, folded into granite facets. -->
  <g mask="url(#strokeGaps)">
    <path fill="url(#granite)" d="M5 46 C5 44 6 43 7 41 L17 24 L24 34 L31 9 L39 33 L46 22 L52 33 L52 53 L9 53 C6.5 53 5 51.5 5 49 Z"/>
    <g clip-path="url(#body)" fill="#050302">
      <path opacity="0.30" d="M17 24 L24 34 L24 53 L17 53 Z"/>
      <path opacity="0.34" d="M31 9 L39 33 L39 53 L31 53 Z"/>
      <path opacity="0.30" d="M46 22 L52 33 L52 53 L46 53 Z"/>
    </g>
    <path d="M7 41 L17 24 L24 34 L31 9 L39 33 L46 22 L52 33" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- dry-brush tail -->
  <g fill="url(#tail)">
    <rect x="49" y="34.6" width="14" height="3.4" rx="1.7"/>
    <rect x="49" y="39.2" width="10" height="3.4" rx="1.7"/>
    <rect x="49" y="43.8" width="12.5" height="3.4" rx="1.7"/>
    <rect x="49" y="48.4" width="7" height="3.4" rx="1.7"/>
  </g>
</svg>
